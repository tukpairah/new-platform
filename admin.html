<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>r2-lobby admin</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/common.css">
<style>
/* Admin (desktop first). Same tokens and panel / button classes as the site. NOT part of the website: never upload this file. */
body{margin:0;background:radial-gradient(#2E3246,#0C070F 85%);color:#fff;min-height:100%;--mf1:#4A4E69;--mf2:#2E3246;--medge:var(--bk);--mring:transparent;--ma1:var(--y2);--ma2:var(--y);--mae:var(--ye);--mst:var(--bk);--mtx:var(--bk);--st:var(--bk)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 18px;background:linear-gradient(var(--sl3),var(--sl) 50%,var(--sl2));border-bottom:3px solid var(--bk)}
.top h1{margin:0 12px 0 0;font-weight:400;font-size:26px}.top .sp{flex:1}
.tab{min-height:40px;padding:0 16px;font-size:18px;border-radius:10px;border:3px solid var(--bk);background:var(--sl);color:#fff}.tab.on{background:linear-gradient(var(--y2),var(--y));color:var(--bk)}
main{max-width:1100px;margin:0 auto;padding:18px}
.panel{background:linear-gradient(var(--mf1),var(--mf2));border:4px solid var(--bk);border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.35);padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 10px;font-weight:400;font-size:26px}
table{width:100%;border-collapse:collapse;font-size:16px}th,td{text-align:left;padding:7px 8px;border-bottom:2px solid rgba(0,0,0,.3);vertical-align:top}th{font-weight:400;opacity:.8}
.ok{color:#8CEB6B}.bad{color:#FF9A90}.warn{color:var(--y2)}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}.f{display:flex;flex-direction:column;gap:3px;min-width:130px;flex:1 1 130px}.f.wide{flex:2 1 300px}
label{font-size:14px;opacity:.85}
input[type=text],input[type=number],select,textarea{font:16px/1.3 system-ui,sans-serif;padding:7px 9px;border-radius:8px;border:3px solid var(--bk);background:rgba(0,0,0,.35);color:#fff;width:100%}
textarea{min-height:90px;resize:vertical}input[type=color]{height:38px;width:70px;border:3px solid var(--bk);border-radius:8px;background:none}
.mbtn.small{width:auto;min-height:38px;margin:0;padding:0 12px;font-size:16px}
.track{display:flex;align-items:center;gap:6px;padding:4px 0}.track span{flex:1;font-size:14px;word-break:break-all}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}.thumbs img{height:64px;border-radius:6px;border:2px solid var(--bk);background:#0006}.thumb{position:relative}.thumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:2px solid var(--bk);background:var(--red);color:#fff;padding:0;line-height:1}
.pill{display:inline-block;padding:2px 8px;border:2px solid var(--bk);border-radius:6px;font-size:13px;color:#fff}.easy{background:var(--green)}.medium{background:#E9A320}.hard{background:var(--red)}
#msg{position:fixed;right:16px;bottom:16px;z-index:9;padding:10px 16px;border:3px solid var(--bk);border-radius:10px;background:var(--sl);box-shadow:0 4px 0 var(--bk)}#msg.good{background:linear-gradient(#5BD64A,#32A021)}#msg[hidden]{display:none}
</style></head>
<body>
<div class="top"><h1 class="t">Admin</h1><button class="tab on" data-tab="dash">Dashboard</button><button class="tab" data-tab="games">Games</button><button class="tab" data-tab="econ">Economy</button><span class="sp"></span>
  <button class="mbtn small grey" id="resetPrev" title="Clears the TEST save used by the preview (never her save)">Reset preview save</button></div>
<main><div id="dash"></div><div id="games" hidden></div><div id="econ" hidden></div></main><div id="msg" hidden></div>
<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let D = null, audio = null;
const say = (t, good) => { const m = $('#msg'); m.textContent = t; m.className = good ? 'good' : ''; m.hidden = false; clearTimeout(say.t); say.t = setTimeout(() => m.hidden = true, 3000); };
const api = async (url, opt) => { const r = await fetch(url, opt); const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j; };
const post = (url, obj) => api(url, { method: 'POST', body: JSON.stringify(obj) });

$$('.tab').forEach(b => b.onclick = () => { $$('.tab').forEach(x => x.classList.toggle('on', x === b)); $('#dash').hidden = b.dataset.tab !== 'dash'; $('#games').hidden = b.dataset.tab !== 'games'; $('#econ').hidden = b.dataset.tab !== 'econ'; if (b.dataset.tab === 'econ') econ(); });
$('#resetPrev').onclick = () => { ['r2dev.save', 'r2dev.save.bak'].forEach(k => localStorage.removeItem(k)); Object.keys(localStorage).filter(k => k.indexOf('r2dev') === 0).forEach(k => localStorage.removeItem(k)); say('Preview save cleared', true); };

/* ---------- dashboard ---------- */
function filled(v) { return Array.isArray(v) ? v.length > 0 : v && typeof v === 'object' ? Object.keys(v).length > 0 : v !== '' && v != null && v !== 0; }
function dash() {
  const warns = [];
  const rows = D.modes.map(m => {
    const sc = m.schemaInfo.schema, fieldsFilled = sc.length ? sc.filter(f => filled(m.content[f.key])).length : null, w = [];
    if (!m.codeExists) w.push('code file missing: shows "Coming soon"');
    if (m.contentFile && !m.contentExists) w.push('content file missing');
    if (sc.length && fieldsFilled < sc.length) w.push((sc.length - fieldsFilled) + ' content field(s) empty');
    if (!m.music.length && !D.defaultMusic.length) w.push('no music (the lobby music keeps playing)');
    if (m.schemaInfo.error) w.push('schema error: ' + m.schemaInfo.error);
    w.forEach(x => warns.push(m.name + ': ' + x));
    return `<tr><td>${esc(m.name)} <span class="pill ${m.difficulty}">${m.difficulty}</span></td><td>Day ${m.unlockDay}</td><td class="${m.codeExists ? 'ok' : 'bad'}">${m.codeExists ? 'yes' : 'missing'}</td>
      <td class="${sc.length ? (fieldsFilled === sc.length ? 'ok' : 'warn') : ''}">${sc.length ? fieldsFilled + ' / ' + sc.length : 'no fields yet'}</td><td class="${m.music.length ? 'ok' : 'warn'}">${m.music.length || 'none'}</td><td class="warn">${w.map(esc).join('<br>')}</td><td><button type="button" class="mbtn small grey" data-prevmode="${m.id}">Preview</button></td></tr>`;
  }).join('');
  if (D.devKey) warns.unshift('config.js devKey is NOT empty ("' + D.devKey + '"): set it to "" before uploading');
  $('#dash').innerHTML = `<div class="panel"><h2 class="t">Game modes</h2><table><tr><th>Mode</th><th>Opens</th><th>Code file</th><th>Content</th><th>Music</th><th>Warnings</th><th></th></tr>${rows}</table></div>
    <div class="panel"><h2 class="t">Checklist</h2>${warns.length ? '<p class="warn">' + warns.map(esc).join('<br>') + '</p>' : '<p class="ok">Nothing to fix.</p>'}<p>Reminder for uploading: leave out tools/, admin.html, tests/, .admin-backups/ and .backup-* folders.</p></div><div class="panel"><h2 class="t">Release check</h2><div id="rel">Checking...</div></div>`;
  api('/api/release').then(r => { $('#rel').innerHTML = r.map(x => `<div class="${x.level === 'error' ? 'bad' : x.level === 'warn' ? 'warn' : x.level === 'ok' ? 'ok' : ''}">${x.level === 'error' ? 'ERROR ' : x.level === 'warn' ? 'Warning ' : ''}${esc(x.text)}</div>`).join(''); });
}

/* ---------- games ---------- */
const names = { text: 'Text', longtext: 'Long text', list: 'List (one per line)', number: 'Number', image: 'Image', images: 'Images', words: 'Words (comma or line separated)', color: 'Colour' };
const getPath = (o, k) => k.split('.').reduce((a, x) => (a == null ? undefined : a[x]), o);
function setPath(o, k, v) { const p = k.split('.'); let a = o; p.slice(0, -1).forEach(x => { a = a[x] = a[x] || {}; }); a[p[p.length - 1]] = v; }
function field(m, f) {
  const v = getPath(m.content, f.key) != null ? getPath(m.content, f.key) : getPath(m.schemaInfo.defaults || {}, f.key), k = esc(f.key), lab = `<label>${esc(f.label || f.key)}</label>`;
  switch (f.type) {
    case 'longtext': return `<div class="f wide">${lab}<textarea data-k="${k}" data-t="longtext">${esc(v || '')}</textarea></div>`;
    case 'number': return `<div class="f">${lab}<input type="number" data-k="${k}" data-t="number" value="${esc(v == null ? '' : v)}"></div>`;
    case 'color': return `<div class="f">${lab}<input type="color" data-k="${k}" data-t="color" value="${esc(v || '#ffffff')}"></div>`;
    case 'list': return `<div class="f wide">${lab}<textarea data-k="${k}" data-t="list">${esc((v || []).join('\n'))}</textarea></div>`;
    case 'words': return `<div class="f wide">${lab}<textarea data-k="${k}" data-t="words">${esc((v || []).join(', '))}</textarea></div>`;
    case 'image': return `<div class="f wide">${lab}<div class="thumbs" data-k="${k}" data-t="image" data-v="${esc(v || '')}">${v ? thumb(v) : ''}</div><input type="file" accept="image/*" data-up="image" data-for="${k}"></div>`;
    case 'images': return `<div class="f wide">${lab}<div class="thumbs" data-k="${k}" data-t="images" data-v="${esc(JSON.stringify(v || []))}">${(v || []).map(thumb).join('')}</div><input type="file" accept="image/*" multiple data-up="images" data-for="${k}"></div>`;
    default: return `<div class="f wide">${lab}<input type="text" data-k="${k}" data-t="text" value="${esc(v || '')}"></div>`;
  }
}
const thumb = p => `<span class="thumb"><img src="/${esc(p)}?t=${Date.now()}" alt=""><button type="button" data-rmimg="${esc(p)}">x</button></span>`;
function card(m) {
  const sc = m.schemaInfo.schema, ov = m.rewards || {}, f1 = ov.first || {}, r1 = ov.repeat || {};
  return `<div class="panel" data-id="${m.id}"><h2 class="t">${esc(m.name)} <span class="pill ${m.difficulty}">${m.difficulty}</span> <small style="font-size:14px">${m.id} &middot; ${m.codeExists ? 'code ok' : 'code missing'}</small></h2>
   <div class="row"><div class="f wide"><label>Name</label><input type="text" data-r="name" value="${esc(m.name)}"></div>
    <div class="f"><label>Difficulty</label><select data-r="difficulty">${['easy', 'medium', 'hard'].map(d => `<option ${d === m.difficulty ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
    <div class="f"><label>Unlock day</label><select data-r="unlockDay">${[1, 2, 3, 4, 5, 6, 7].map(d => `<option ${d === m.unlockDay ? 'selected' : ''}>${d}</option>`).join('')}</select></div>
    <div class="f"><label>Min seconds</label><input type="number" min="1" data-r="minSeconds" value="${m.minSeconds}"></div></div>
   <div class="row"><div class="f"><label>First clear Gems (empty = by difficulty)</label><input type="number" data-r="fg" value="${f1.gems != null ? f1.gems : ''}"></div><div class="f"><label>First clear XP</label><input type="number" data-r="fx" value="${f1.xp != null ? f1.xp : ''}"></div>
    <div class="f"><label>Repeat Gems (empty = default)</label><input type="number" data-r="rg" value="${r1.gems != null ? r1.gems : ''}"></div><div class="f"><label>Repeat XP</label><input type="number" data-r="rx" value="${r1.xp != null ? r1.xp : ''}"></div></div>
   <div class="row"><div class="f"><label>Icon (empty = drawn default)</label><input data-r="icon" value="${esc(m.icon || '')}" placeholder="img/games/${esc(m.id)}/icon.png"></div><div class="f"><label>Locked icon (optional)</label><input data-r="iconLocked" value="${esc(m.iconLocked || '')}" placeholder="img/games/${esc(m.id)}/locked.png"></div></div>
   <div class="row" style="align-items:center;gap:10px"><span style="display:inline-block;width:48px;height:48px;background:#0003;border-radius:8px">${m.icon ? `<img src="/${esc(m.icon)}" style="width:48px;height:48px;object-fit:contain">` : '<small>drawn</small>'}</span><input type="file" accept="image/png,image/*" data-upicon="icon"> <input type="file" accept="image/png,image/*" data-upicon="iconLocked"></div>
   <label>WIN clips for this mode (empty = shared)</label>${lst(m, 'winSound')}<label>LOSE clips for this mode (empty = shared)</label>${lst(m, 'loseSound')}
   <label>MUSIC (plays when this mode opens; empty = defaultMusic, then the lobby music)</label>
   <div class="music">${m.music.map((p, i) => `<div class="track"><button type="button" class="mbtn small grey" data-play="${esc(p)}">&#9654;</button><span>${esc(p)}</span><button type="button" class="mbtn small grey" data-mv="${i}:-1">&uarr;</button><button type="button" class="mbtn small grey" data-mv="${i}:1">&darr;</button><button type="button" class="mbtn small grey" data-rm="${i}">&times;</button></div>`).join('') || '<small>No tracks.</small>'}</div>
   <div class="row" style="margin-top:6px"><input type="file" accept="audio/*" multiple data-upmusic></div>
   ${sc.length ? `<h2 class="t" style="font-size:20px;margin-top:10px">Content</h2><div class="row content">${sc.map(f => field(m, f)).join('')}</div>` : '<p><small>This mode has no editable content yet (its schema is empty).</small></p>'}
   <div class="row"><button type="button" class="mbtn small" data-save>Save</button><button type="button" class="mbtn small grey" data-preview>Preview</button></div></div>`;
}
const lst = (m, key, up) => `<div class="music">${(m[key] || []).map((p, i) => `<div class="track"><button type="button" class="mbtn small grey" data-play="${esc(p)}">&#9654;</button><span>${esc(p)}</span><button type="button" class="mbtn small grey" data-mv="${key}:${i}:-1">&uarr;</button><button type="button" class="mbtn small grey" data-mv="${key}:${i}:1">&darr;</button><button type="button" class="mbtn small grey" data-rm="${key}:${i}">&times;</button></div>`).join('') || '<small>Empty = ' + (up || 'the shared list / the built-in jingle') + '.</small>'}</div><div class="row" style="margin-top:6px"><input type="file" accept="audio/*" multiple data-uplist="${key}"></div>`;
function resPanel() { const R = D.resMode; return `<div class="panel" data-id="__r"><h2 class="t">Result sounds (shared)</h2><small>Played on every win / lose screen. Clips go to audio/results/ (MP3 or M4A, under ~10 s). Empty = built-in jingles.</small>
  <label>WIN clips</label>${lst(R, 'winSound')}<label>LOSE clips</label>${lst(R, 'loseSound')}
  <div class="row"><div class="f"><label>Max seconds</label><input type="number" min="1" data-r="maxSeconds" value="${R.maxSeconds}"></div><div class="f"><label>Volume 0-1</label><input type="number" step="0.1" min="0" max="1" data-r="volume" value="${R.volume}"></div></div>
  <button type="button" class="mbtn" data-saveres>Save result sounds</button></div>`; }
function games() { D.resMode = { id: '__r', winSound: D.results.win.slice(), loseSound: D.results.lose.slice(), maxSeconds: D.results.maxSeconds, volume: D.results.volume }; $('#games').innerHTML = resPanel() + D.modes.map(card).join(''); }
function readCard(el, m) {
  const g = s => $(`[data-r="${s}"]`, el).value, num = s => g(s) === '' ? null : +g(s);
  m.name = g('name'); m.icon = g('icon').trim(); m.iconLocked = g('iconLocked').trim(); m.difficulty = g('difficulty'); m.unlockDay = +g('unlockDay'); m.minSeconds = +g('minSeconds') || 1;
  const first = num('fg') != null ? { gems: num('fg'), xp: num('fx') || 0 } : null, rep = num('rg') != null ? { gems: num('rg'), xp: num('rx') || 0, oncePerDay: true } : null;
  if (first || rep) { m.rewards = {}; if (first) m.rewards.first = first; if (rep) m.rewards.repeat = rep; } else delete m.rewards;
  const c = {};
  $$('[data-k]', el).forEach(i => {
    const k = i.dataset.k, t = i.dataset.t;
    if (t === 'number') setPath(c, k, i.value === '' ? 0 : +i.value);
    else if (t === 'list') setPath(c, k, i.value.split('\n').map(x => x.trim()).filter(Boolean));
    else if (t === 'words') setPath(c, k, i.value.split(/[,\n]/).map(x => x.trim()).filter(Boolean));
    else if (t === 'image') setPath(c, k, i.dataset.v || '');
    else if (t === 'images') setPath(c, k, JSON.parse(i.dataset.v || '[]'));
    else setPath(c, k, i.value);
  });
  m.content = c;
}
async function upload(rel, file) { const r = await fetch('/api/upload?path=' + encodeURIComponent(rel), { method: 'POST', body: file }); const j = await r.json(); if (!r.ok) throw new Error(j.error); return rel; }
const safeName = n => n.replace(/[^\w.\- ()]/g, '_');
document.addEventListener('click', async e => {
  const el = e.target.closest('.panel[data-id]'); if (!el) return; const m = el.dataset.id === '__r' ? D.resMode : D.modes.find(x => x.id === el.dataset.id), b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.saveres !== undefined) { const R = D.resMode; await post('/api/results', { win: R.winSound, lose: R.loseSound, maxSeconds: +$('[data-r="maxSeconds"]', el).value, volume: +$('[data-r="volume"]', el).value }); say('Saved result sounds', true); await load(); return; }
    if ((b.dataset.mv && b.dataset.mv.split(':').length === 3) || (b.dataset.rm && b.dataset.rm.indexOf(':') > 0)) {
      const shared = el.dataset.id === '__r'; if (shared) { m.maxSeconds = +$('[data-r="maxSeconds"]', el).value; m.volume = +$('[data-r="volume"]', el).value; } else readCard(el, m);
      if (b.dataset.mv) { const [k, i, d] = b.dataset.mv.split(':'), n = +i, j = n + +d; if (j >= 0 && j < m[k].length) [m[k][n], m[k][j]] = [m[k][j], m[k][n]]; }
      else { const [k, i] = b.dataset.rm.split(':'), p = m[k].splice(+i, 1)[0]; if (confirm('Also delete the file ' + p + '?')) await api('/api/file?path=' + encodeURIComponent(p), { method: 'DELETE' }); }
      if (shared) { D.results.win = m.winSound; D.results.lose = m.loseSound; D.results.maxSeconds = m.maxSeconds; D.results.volume = m.volume; } games(); return;
    }
    if (b.dataset.save !== undefined) {
      readCard(el, m);
      await post('/api/games/registry', { defaultMusic: D.defaultMusic, list: D.modes.map(x => ({ id: x.id, name: x.name, difficulty: x.difficulty, unlockDay: x.unlockDay, file: x.file, contentFile: x.contentFile, minSeconds: x.minSeconds, winSound: x.winSound || [], loseSound: x.loseSound || [], icon: x.icon || '', iconLocked: x.iconLocked || '', music: x.music, rewards: x.rewards })) });
      if (m.contentFile && m.schemaInfo.schema.length) await post('/api/games/content/' + m.id, m.content);
      say('Saved ' + m.name, true); await load(); return;
    }
    if (b.dataset.preview !== undefined) { window.open('/preview?mode=' + m.id, 'r2preview'); return; }
    if (b.dataset.play) { if (audio) audio.pause(); audio = new Audio('/' + b.dataset.play); audio.play(); return; }
    if (b.dataset.mv) { readCard(el, m); const [i, d] = b.dataset.mv.split(':').map(Number), j = i + d; if (j >= 0 && j < m.music.length) { [m.music[i], m.music[j]] = [m.music[j], m.music[i]]; } const c = m.content; games(); return; }
    if (b.dataset.rm !== undefined) { readCard(el, m); const p = m.music.splice(+b.dataset.rm, 1)[0]; if (confirm('Also delete the file ' + p + '?')) await api('/api/file?path=' + encodeURIComponent(p), { method: 'DELETE' }); games(); return; }
    if (b.dataset.rmimg) { const box = b.closest('.thumbs'); if (box.dataset.t === 'image') box.dataset.v = ''; else box.dataset.v = JSON.stringify(JSON.parse(box.dataset.v).filter(x => x !== b.dataset.rmimg)); b.closest('.thumb').remove(); return; }
  } catch (err) { say('Error: ' + err.message); }
});
document.addEventListener('change', async e => {
  const inp = e.target, el = inp.closest('.panel[data-id]'); if (!el || inp.type !== 'file') return; const m = el.dataset.id === '__r' ? D.resMode : D.modes.find(x => x.id === el.dataset.id);
  try {
    if (inp.dataset.uplist) { const k = inp.dataset.uplist, shared = el.dataset.id === '__r'; if (shared) { m.maxSeconds = +$('[data-r="maxSeconds"]', el).value; m.volume = +$('[data-r="volume"]', el).value; } else readCard(el, m); for (const f of inp.files) m[k].push(await upload('audio/results/' + safeName(f.name), f)); if (shared) { D.results.win = m.winSound; D.results.lose = m.loseSound; D.results.maxSeconds = m.maxSeconds; D.results.volume = m.volume; } games(); say('Uploaded', true); return; }
    if (inp.dataset.upicon) { readCard(el, m); const f = inp.files[0]; if (f) { m[inp.dataset.upicon] = await upload('img/games/' + m.id + '/' + safeName(f.name), f); games(); say('Uploaded', true); } return; }
    if (inp.dataset.upmusic !== undefined) { readCard(el, m); for (const f of inp.files) m.music.push(await upload('audio/games/' + m.id + '/' + safeName(f.name), f)); games(); say('Uploaded', true); return; }
    const box = $(`.thumbs[data-k="${inp.dataset.for}"]`, el);
    for (const f of inp.files) {
      const p = await upload('img/games/' + m.id + '/' + safeName(f.name), f);
      if (inp.dataset.up === 'image') { box.dataset.v = p; box.innerHTML = thumb(p); } else { const arr = JSON.parse(box.dataset.v || '[]'); arr.push(p); box.dataset.v = JSON.stringify(arr); box.insertAdjacentHTML('beforeend', thumb(p)); }
    }
    say('Uploaded (press Save to keep it in the content)', true);
  } catch (err) { say('Error: ' + err.message); }
});
document.addEventListener('click', e => { const b = e.target.closest('[data-prevmode]'); if (b) window.open('/preview?mode=' + b.dataset.prevmode, 'r2preview'); });
async function econ() {
  const a = await api('/api/economy'), names = { perfect: 'Perfect', typical: 'Typical', minimal: 'Minimal' };
  const tbl = (k, p) => `<h3 class="t" style="font-size:22px;margin:14px 0 4px">${names[k]} <small style="font-size:14px;opacity:.8">${esc(p.about)}</small></h3><table><tr><th>Day</th><th>+Gems</th><th>Total Gems</th><th>+XP</th><th>Total XP</th><th>Pass needs</th><th>XP margin</th></tr>${p.rows.map(r => `<tr><td>${r.day}</td><td>${r.gems}</td><td>${r.cumGems}</td><td>${r.xp}</td><td>${r.cumXp}</td><td>${r.passNeed}</td><td class="${r.margin >= 10 ? 'ok' : 'bad'}">${r.margin}</td></tr>`).join('')}</table>
    <p>Bazaar items become affordable on day: ${p.afford.map((d, i) => `${a.prices[i]} Gems = ${d || 'never'}`).join(' &middot; ')}. All five: <b>${p.allDay || 'never'}</b>. Gems left on Day 7 after buying all five: <b class="${p.left7 >= 0 ? 'ok' : 'warn'}">${p.left7}</b>. Every pass step reachable: <b class="${p.passOk ? 'ok' : 'bad'}">${p.passOk ? 'yes' : 'NO'}</b></p>`;
  $('#econ').innerHTML = `<div class="panel"><h2 class="t">Economy audit</h2><p>Prices ${a.prices.join(' / ')} (total ${a.total}). Mode rewards: ${Object.entries(a.rewards).map(([k, v]) => k + ' ' + v.gems + 'g/' + v.xp + 'xp').join(', ')}.</p>
    ${a.ok ? '<p class="ok">All targets are met.</p>' : a.warnings.map(w => `<p class="bad">&#9888; ${esc(w)}</p>`).join('')}${Object.keys(a.players).map(k => tbl(k, a.players[k])).join('')}</div>`;
}
async function load() { D = await api('/api/games'); dash(); games(); }
load().catch(e => say('Cannot reach the admin server: ' + e.message));
</script></body></html>
