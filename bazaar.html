<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bazaar</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
/* Bazaar layout. Items, prices, music and texts are all in config.js */
html,body{min-height:100%;background:#1F0B59;color:#fff}
body{margin:0;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 54px),repeating-linear-gradient(-45deg,rgba(255,255,255,.04) 0 2px,transparent 2px 54px),linear-gradient(#341D7E,#2C176E 45%,#1F0B59)}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;--st:#12062F}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px 22px;padding-top:max(14px,env(safe-area-inset-top));
  background:linear-gradient(#3A2088,#2C1572);border-bottom:4px solid #12062F}
.dp{background:linear-gradient(#4A3AA8,#33227D 50%,#26185E);border:3px solid #12062F;border-radius:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 4px 0 #12062F}
.sq{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none}
.sq .ico{width:26px;height:26px}
.sq.back .ico{width:30px;height:30px}
.title{font-size:34px;margin:0;font-weight:400;flex:1 1 auto;min-width:0}
.right{display:flex;align-items:center;gap:12px}
.coinpill{--st:#12062F}
.hint{margin:16px 24px 0;font-size:18px;text-align:center;opacity:.92}
.shelf{width:100%;max-width:1240px;margin:0 auto;padding:22px 32px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:30px;justify-items:center}
.card{position:relative;width:100%;max-width:290px;display:flex;flex-direction:column;border:4px solid #12062F;border-radius:8px;overflow:hidden;
  background:#2E1772;box-shadow:0 7px 0 rgba(0,0,0,.35)}
.card .top{position:relative;padding:10px 10px 11px;text-align:center;font-size:20px;background:linear-gradient(#7B4DFF,#6734FD 60%,#5A2BE6);border-bottom:3px solid #12062F}
.card .tag{position:absolute;right:-4px;top:-3px;padding:3px 10px 5px;font-size:13px;background:#E6442F;border:3px solid #12062F;border-radius:4px;transform:rotate(4deg)}
.art{position:relative;flex:1 1 auto;min-height:250px;display:flex;align-items:center;justify-content:center;padding:44px 14px 58px;
  background:linear-gradient(#342CE5,#4D6CF2 55%,#84DFFD)}
.art .nm{position:absolute;top:10px;left:8px;right:8px;text-align:center;font-size:22px;--st:#1A0F5E}
.art img{max-width:100%;max-height:170px;object-fit:contain;display:block;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.art .ph{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px;height:130px;justify-content:center;border:2px dashed rgba(255,255,255,.55);border-radius:10px;font-size:14px;color:rgba(255,255,255,.85)}
.art .ph .ico{width:56px;height:56px}
.art .dsc{position:absolute;left:10px;right:10px;bottom:10px;padding:6px 8px 7px;font-size:15px;line-height:1.2;text-align:center;color:#12062F;background:rgba(255,255,255,.78);border-radius:8px}
.art .rb{position:absolute;right:-6px;top:50px;padding:4px 10px 5px;font-size:14px;line-height:1.05;text-align:center;background:linear-gradient(#C42BF2,#9206E3);border:2px solid #fff;border-radius:6px;transform:rotate(5deg);--st:#4C0A8A}
.price{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:66px;border:0;border-top:3px solid #12062F;
  background:linear-gradient(#3B2190,#2E1772);color:#fff;font-size:32px;line-height:1;text-shadow:0 3px 0 #12062F}
.price .ico{width:30px;height:30px}
.price .old{font-size:20px;opacity:.6;text-decoration:line-through;margin-right:4px}
.price.poor .num{color:#FF9A9A}
.price.owned{background:linear-gradient(#45BA20,#2E8A12);cursor:default}
.price.soon{background:linear-gradient(#6C7592,#4F5875);font-size:22px;cursor:default}
.card.soon .art{background:linear-gradient(#3B3A7E,#6E78B8 55%,#9AA6D6)}
.price:not(.owned):active{transform:translateY(2px)}
.price:not(.owned):hover{filter:brightness(1.12)}
.empty{grid-column:1/-1;text-align:center;font-size:20px;opacity:.9}
.card.r-common{border-color:#8E94A3}.card.r-common .top{background:linear-gradient(#A3A9B8,#7D8394 60%,#6B7183)}
.card.r-rare{border-color:#2C6FD6}.card.r-rare .top{background:linear-gradient(#5AA2FF,#3B83DF 60%,#2C6FD6)}
.card.r-epic{border-color:#8A2BE2;box-shadow:0 0 0 2px #C792FF,0 7px 0 rgba(0,0,0,.35)}.card.r-epic .top{background:linear-gradient(#C54DFF,#9A2BE6 60%,#7B1FC4)}
.card.r-legendary{border-color:#E2A21B;box-shadow:0 0 0 3px #FFE27A,0 0 18px rgba(255,214,90,.55),0 7px 0 rgba(0,0,0,.35)}.card.r-legendary .top{background:linear-gradient(#FFD96A,#F4C444 60%,#D9992B);color:#fff}
.sil{display:flex;align-items:center;justify-content:center;width:130px;height:130px;opacity:.9}.sil .ico{width:100%;height:100%}.sil svg,.sil img{filter:brightness(0) opacity(.55)}
.price.locked{background:linear-gradient(#6C7592,#4F5875);font-size:22px;cursor:default}
.price.need{background:linear-gradient(#6C7592,#4F5875);font-size:20px;cursor:default}
.price.open{background:linear-gradient(#F0DA50,#F4C444 55%,#E5B741);color:#12062F;text-shadow:none;font-size:26px;box-shadow:inset 0 -5px 0 #C6923B}
.own-rb{position:absolute;right:-6px;top:50px;z-index:2;padding:4px 10px 5px;font-size:14px;line-height:1.05;background:linear-gradient(#5BD64A,#32A021);border:2px solid #fff;border-radius:6px;transform:rotate(5deg);--st:#0E3A08}
.card-ic{max-width:100%;max-height:170px;object-fit:contain;display:block;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}.card.owned .art{background:linear-gradient(#2E8A12,#45BA20 55%,#9CEB6B)}
.card.shake{animation:cardShake .4s linear}@keyframes cardShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-1.5deg)}40%{transform:translateX(5px) rotate(1.5deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.card.fresh .art::after{content:"";position:absolute;right:16px;top:58px;width:24px;height:24px;background:#FFE27A;clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%);animation:twinkle 1.1s ease-in-out 3}
@keyframes twinkle{0%,100%{transform:scale(.4) rotate(0);opacity:0}50%{transform:scale(1.1) rotate(40deg);opacity:1}}
/* the gift window */
.modal.gw{width:min(560px,100%);text-align:center}.modal.gw h2{display:inline-block;margin:-4px 0 12px;padding:6px 18px 8px;background:var(--gwc,#7B4DFF);border:3px solid var(--bk);border-radius:8px;font-size:26px}
.gw-ic{width:96px;height:96px;margin:0 auto 6px}.gw-ic img,.gw-ic svg,.gw-ic .ico{width:100%;height:100%;object-fit:contain;display:block}.gw-name{font-size:26px;margin:0 0 10px}
.gw .mbtn.big{display:block;min-height:60px;line-height:54px;text-align:center;text-decoration:none;font-size:26px;padding:0 10px}.gw .mbtn.small{margin-top:8px}
.gp-view{position:relative;touch-action:pan-y}.gp-view img{display:block;max-width:100%;max-height:42vh;margin:0 auto;border-radius:10px;border:3px solid #fff;box-shadow:0 0 0 2px var(--bk)}.gp-cap{font-size:16px;margin:8px 0 10px;min-height:20px}
.gp-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0}.gp-nav .mbtn.small{margin:0;min-width:48px;min-height:44px}.gp-dots{font-size:15px;opacity:.85}
/* the voice player */
.vp{display:flex;align-items:center;gap:14px;padding:12px;margin:8px 0;background:rgba(0,0,0,.28);border-radius:12px}
.vp-btn{flex:none;width:72px;height:72px;border-radius:50%;border:4px solid var(--bk);background:linear-gradient(#F0DA50,#F4C444 55%,#E5B741);box-shadow:inset 0 -5px 0 #C6923B,0 4px 0 var(--bk);display:flex;align-items:center;justify-content:center;padding:0}
.vp-btn:active{transform:translateY(2px)}.vp-btn svg{width:34px;height:34px}.vp-btn .ps,.vp-btn.on .pl{display:none}.vp-btn.on .ps{display:block}
.vp-main{flex:1 1 auto;min-width:0}.vp-bar{position:relative;height:26px;border:3px solid var(--bk);border-radius:10px;background:rgba(0,0,0,.4);overflow:hidden;touch-action:none;cursor:pointer}
.vp-bar i{position:absolute;inset:0;background:linear-gradient(#F0DA50,#F4C444);transform:scaleX(0);transform-origin:left;will-change:transform}
.vp-time{display:flex;justify-content:space-between;font-size:15px;margin-top:4px}.vp-err{color:#FF9A90}
@media (prefers-reduced-motion:reduce){.card.shake,.card.fresh .art::after{animation:none}}
.viewer-img{display:block;max-width:100%;max-height:50vh;margin:0 auto 12px;border-radius:10px}
.viewer-media{display:block;width:100%;margin:0 0 12px;border-radius:10px}
.companion{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:84px;height:110px;z-index:4;--st:#12062F}
.companion .r2btn{appearance:none;background:transparent;border:0;display:block;width:100%;height:100%;padding:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.companion .mini{position:absolute;right:60px;bottom:88px;width:max-content;max-width:min(230px,64vw);z-index:2;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35));pointer-events:none}
.companion .mini .beep{display:block;padding:11px 14px 22px;background:#fff;color:#1d1e26;text-align:center;line-height:1.15;font-size:16px;
  clip-path:polygon(0 14%,5% 0,95% 0,100% 14%,100% 70%,95% 82%,70% 82%,86% 100%,58% 82%,5% 82%,0 70%)}
.mini.pop{animation:pop .28s ease-out}@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
.price[aria-disabled="true"]{cursor:default}
@media (prefers-reduced-motion:reduce){.mini.pop{animation:none}}
.mine-img{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none}

/* phone / narrow: swipe sideways like the game */
@media (max-width:820px){
  .shelf{display:flex;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;gap:18px;
    padding:20px 9vw 36px;-webkit-overflow-scrolling:touch;scrollbar-width:none;align-items:stretch}
  .shelf::-webkit-scrollbar{display:none}
  .card{flex:0 0 min(74vw,300px);scroll-snap-align:center}
  .title{font-size:28px}
  .bar{padding:12px 14px;gap:10px}.right{gap:8px}
  .sq{width:44px;height:44px}.coinpill{height:44px;padding:0 12px 0 8px}
  .coinpill .t{font-size:20px}
}
@media (max-height:520px) and (orientation:landscape){
  .art{min-height:130px;padding-top:40px}.card .top{font-size:16px;padding:6px}.price{height:52px;font-size:26px}
  .card{flex-basis:210px}.hint{display:none}.shelf{padding-top:14px}
}

</style>
<link rel="stylesheet" href="mobile.css">
</head>
<body data-mode="bazaar">
<div id="bg"></div>
<div class="page">
  <header class="bar">
    <!-- ICON SLOT: CONFIG.icons.back -->
    <button type="button" class="dp sq back" id="back" aria-label="Back to the lobby"><span class="ico" data-icon="back"></span></button>
    <h1 class="t title" id="title">Bazaar</h1>
    <div class="right">
      <!-- ICON SLOT: CONFIG.icons.gem -->
      <div class="dp coinpill" aria-label="Your coins"><span class="ico" data-icon="gem"></span><span class="t" data-coins>0</span></div>
      <!-- ICON SLOT: CONFIG.icons.bag -->
      <button type="button" class="dp sq" id="mine" aria-label="My items"><span class="ico" data-icon="bag"></span></button>
      <button type="button" class="dp sq" id="snd" aria-label="Sound on or off"><span class="ico" data-icon="sound"></span></button>
    </div>
  </header>
  <p class="hint" id="hint"></p>
  <main id="shelf" class="shelf" aria-label="Items for sale"></main>
</div>
<div class="r2wrap companion"><div class="mini" aria-live="polite"><span class="beep"></span></div><button type="button" class="r2btn" data-r2 aria-label="R2-D2"></button></div>
<div id="modalRoot" class="modal-root" hidden></div>
<div id="welcome" class="welcome" role="dialog" aria-modal="true" aria-label="Welcome to the Bazaar" hidden>
  <div class="welcome-card">
    <div class="t welcome-h" id="welcomeTitle"></div>
    <p class="welcome-p" id="welcomeText"></p>
    <button type="button" class="welcome-go" id="welcomeGo"></button>
  </div>
</div>

<script src="config.js"></script>
<script src="lib/registry.js"></script>
<script src="content/settings.js"></script>
<script src="content/economy.js"></script>
<script src="content/shop.js"></script>
<script src="content/phrases.js"></script>
<script src="lib/core.js"></script>
<script src="lib/brain.js"></script>
<script src="lib/voice.js"></script>
<script src="lib/sfx.js"></script>
<script src="common.js"></script>
<script src="lib/r2.js"></script>
<script src="lib/fx.js"></script>
<script>
/* ============================================================
   Bazaar code. Items, prices, music and texts are in config.js
   ============================================================ */
const B = CONFIG.bazaar;
const cur = CONFIG.currency.name;
const coin = () => `<span class="ico">${iconHTML('gem')}</span>`;

function cardSoon() {
  return `<article class="card soon">
    <div class="top t">COMING SOON</div>
    <div class="art"><div class="nm t">???</div><span class="ph"><span class="ico">${iconHTML('soon')}</span>COMING SOON</span></div>
    <button type="button" class="price soon t" disabled style="--st:#12062F">COMING SOON</button></article>`;
}
const RARITY = { common: 'COMMON', rare: 'RARE', epic: 'EPIC', legendary: 'LEGENDARY' };
const imgLike = x => /\.(png|jpe?g|webp|svg|gif)(\?|$)/i.test(x || '');
const teaserOf = it => (imgLike(it.teaser) ? (it.desc || '') : (it.teaser || it.desc || ''));            // (older files used "desc" for the text and "teaser" for the picture)
const iconOf = (it, have) => (have && it.iconOwned) || it.icon || (imgLike(it.teaser) ? it.teaser : '');
let freshId = '';
function cardHTML(it) {
  if (B.comingSoon || it.soon) return cardSoon();
  const rar = RARITY[it.rarity] ? it.rarity : 'common', price = R2.price(it), from = it.availableFromDay || 0;   // availableFromDay is optional: none = open from the start
  const have = owned(it.id), gems = getCoins(), ic = iconOf(it, have);
  const art = ic ? `<img class="card-ic" src="${esc(ic)}" alt="" data-ic="${esc(it.id)}">` : `<span class="sil"><span class="ico">${iconHTML('gift')}</span></span>`;
  let btn;
  if (have) btn = `<button type="button" class="price open t" data-open="${esc(it.id)}" style="--st:#12062F">OPEN</button>`;
  else if (from && R2.day() < from) btn = `<button type="button" class="price locked t" aria-disabled="true" data-deny="locked" data-from="${from}" style="--st:#12062F">Opens Day ${from}</button>`;
  else if (gems < price) btn = `<button type="button" class="price need t" aria-disabled="true" data-deny="poor" style="--st:#12062F">Need ${price - gems} more ${esc(cur)}</button>`;
  else btn = `<button type="button" class="price" data-buy="${esc(it.id)}" aria-label="Buy ${esc(it.name)} for ${price} ${esc(cur)}">${coin()}<span class="num t">${price}</span></button>`;
  return `<article class="card r-${rar}${have ? ' owned' : ''}${freshId === it.id ? ' fresh' : ''}" data-card="${esc(it.id)}">
    <div class="top t">${RARITY[rar]}</div>
    <div class="art"><div class="nm t">${esc(it.name)}</div>${art}${have ? '<div class="own-rb t">&#10003; OWNED</div>' : ''}<div class="dsc">${esc(teaserOf(it))}</div></div>
    ${btn}</article>`;
}
function render() {
  $('#shelf').innerHTML = B.items.length ? B.items.map(cardHTML).join('') : '<p class="empty">Nothing here yet.</p>';
  $$('img[data-ic]').forEach(im => im.addEventListener('error', () => { im.replaceWith(Object.assign(document.createElement('span'), { className: 'sil', innerHTML: '<span class="ico">' + iconHTML('gift') + '</span>' })); }, { once: true }));      // a missing icon falls back to the drawn gift
  refreshCoins();
}

/* ---------- buying and the viewer ---------- */
const itemById = id => B.items.find(x => x.id === id);
const SOON = '<div style="padding:18px 6px"><p class="qq">Coming soon</p><p class="mnote">The gift is being prepared.</p></div>';
const PLAY = '<svg class="pl" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#12062F"/></svg><svg class="ps" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="#12062F"/></svg>';
const RCOL = { common: '#7D8394', rare: '#3B83DF', epic: '#9A2BE6', legendary: '#E2A21B' };
const fmt = t => { t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const playerHTML = () => `<div class="vp"><button type="button" class="vp-btn" data-vp aria-label="Play or pause">${PLAY}</button><div class="vp-main"><div class="vp-bar" data-vpbar role="slider" aria-label="Position" tabindex="0"><i></i></div><div class="vp-time"><span data-vpcur>0:00</span><span data-vpdur>0:00</span></div></div></div><p class="mnote vp-err" data-vperr hidden>The voice file is not here yet. It will be soon.</p>`;
let voice = null, gp = { i: 0, list: [] };
function stopVoice() { if (voice) { try { voice.pause(); voice.removeAttribute('src'); voice.load(); } catch (e) {} voice = null; sync(); } }       // the bazaar music comes back
function mountPlayer(root, src) {                                  // playback only starts when she presses play
  stopVoice(); const a = new Audio(); a.preload = 'metadata'; a.src = src; voice = a;
  const btn = $('[data-vp]', root), bar = $('[data-vpbar]', root), fill = $('i', bar), cur = $('[data-vpcur]', root), dur = $('[data-vpdur]', root), err = $('[data-vperr]', root);
  a.addEventListener('loadedmetadata', () => { dur.textContent = fmt(a.duration); });
  a.addEventListener('timeupdate', () => { fill.style.transform = 'scaleX(' + (a.duration ? a.currentTime / a.duration : 0) + ')'; cur.textContent = fmt(a.currentTime); });
  a.addEventListener('play', () => { btn.classList.add('on'); music.pause(); });
  const off = () => { btn.classList.remove('on'); if (!document.hidden) sync(); };
  a.addEventListener('pause', off); a.addEventListener('ended', () => { off(); fill.style.transform = 'scaleX(0)'; cur.textContent = '0:00'; });
  a.addEventListener('error', () => { err.hidden = false; btn.disabled = true; btn.classList.remove('on'); });
  btn.addEventListener('click', () => { if (a.paused) a.play().catch(() => { err.hidden = false; }); else a.pause(); });
  const seek = e => { const r = bar.getBoundingClientRect(); if (a.duration) a.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * a.duration; };
  let drag = false; bar.addEventListener('pointerdown', e => { drag = true; try { bar.setPointerCapture(e.pointerId); } catch (x) {} seek(e); }); bar.addEventListener('pointermove', e => { if (drag) seek(e); }); bar.addEventListener('pointerup', () => { drag = false; });
  bar.addEventListener('keydown', e => { if (e.key === 'ArrowRight') a.currentTime += 5; else if (e.key === 'ArrowLeft') a.currentTime -= 5; });
}
const blank = x => !x || !String(x).trim();
function giftBody(it, p) {                                        // null = nothing filled in yet -> the "Coming soon" panel
  const type = it.type || p.type;
  if (type === 'link') { if (blank(p.url)) return null; return (p.note ? `<p class="mnote">${esc(p.note)}</p>` : '') + `<a class="mbtn big" href="${esc(p.url.trim())}" target="_blank" rel="noopener noreferrer" data-sfx="open">${esc(p.buttonLabel || 'OPEN')}</a><button type="button" class="mbtn small grey" data-copylink="${esc(p.url.trim())}">Copy link</button>`; }
  if (type === 'letter' || type === 'text') { if (blank(p.message) && blank(p.text)) return null; return (p.title ? `<p class="qq">${esc(p.title)}</p>` : '') + Fx.paper({ message: p.message || p.text, signature: p.signature }); }
  if (type === 'voice') { if (blank(p.audio)) return null; return (p.title ? `<p class="qq">${esc(p.title)}</p>` : '') + playerHTML() + (p.caption ? `<p class="mnote">${esc(p.caption)}</p>` : ''); }
  if (type === 'photoVoice') {
    gp = { i: 0, list: (p.photos || []).filter(x => x && !blank(x.src)) }; if (!gp.list.length && blank(p.audio)) return null;
    const nav = gp.list.length > 1 ? `<div class="gp-nav"><button type="button" class="mbtn small grey" data-gp="-1" aria-label="Previous photo">&larr;</button><span class="gp-dots" data-gpdots></span><button type="button" class="mbtn small grey" data-gp="1" aria-label="Next photo">&rarr;</button></div>` : '';
    return (p.title ? `<p class="qq">${esc(p.title)}</p>` : '') + (gp.list.length ? `<div class="gp-view" data-gpview></div><p class="gp-cap" data-gpcap></p>${nav}` : '') + (blank(p.audio) ? '' : playerHTML()) + (p.caption ? `<p class="mnote">${esc(p.caption)}</p>` : '');
  }
  return null;
}
function showPhoto() {
  const v = $('[data-gpview]'); if (!v) return; const x = gp.list[gp.i]; v.innerHTML = `<img src="${esc(x.src)}" alt="" draggable="false">`;
  $('img', v).addEventListener('error', e => { e.target.replaceWith(Object.assign(document.createElement('p'), { className: 'mnote', textContent: 'The photo is not here yet.' })); }, { once: true });
  $('[data-gpcap]').textContent = x.caption || ''; const d = $('[data-gpdots]'); if (d) d.textContent = (gp.i + 1) + ' / ' + gp.list.length;
}
async function openGift(it, first) {                                // no ledger entry here: she already owns it
  const rar = RARITY[it.rarity] ? it.rarity : 'common', ic = iconOf(it, true);
  openModal('GIFT UNLOCKED', '<p class="mnote">Opening...</p>'); const m = $('.modal', modalRoot()); m.classList.add('gw'); m.style.setProperty('--gwc', RCOL[rar]);
  const p = (await R2.loadPayload(it.id)) || {};                  // the private file is fetched only now
  const inner = giftBody(it, p);
  setModalBody(`<div class="gw-ic">${ic ? `<img src="${esc(ic)}" alt="" data-ic2>` : `<span class="ico">${iconHTML('gift')}</span>`}</div><div class="t gw-name">${esc(it.name)}</div>${inner || SOON}<button type="button" class="mbtn" data-close style="margin-top:12px">Close</button>`);
  $$('img[data-ic2]', modalRoot()).forEach(im => im.addEventListener('error', () => { im.replaceWith(Object.assign(document.createElement('span'), { className: 'ico', innerHTML: iconHTML('gift') })); }, { once: true }));
  if (inner) {
    if ((it.type || p.type) === 'letter' || p.type === 'text') { m.classList.add('letter'); Fx.after(m); }
    if ($('[data-gpview]')) showPhoto();
    if (p.audio && $('[data-vp]')) mountPlayer(m, p.audio);
  }
  if (first) Fx.unfold(m, document.querySelector(`[data-card="${it.id}"]`));
}
function unlockEffect(it, done) {                                  // card shake, flash, confetti, pop + chime; then the gift window
  const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches), card = document.querySelector(`[data-card="${it.id}"]`);
  if (card) { try { card.scrollIntoView({ block: 'nearest', inline: 'center' }); } catch (e) {} if (!reduced) card.classList.add('shake'); }
  setTimeout(() => {
    if (card) { card.classList.remove('shake'); const r = card.getBoundingClientRect(); Fx.burst(r.left + r.width / 2, r.top + r.height / 2); }
    Sfx.play('buy'); setTimeout(() => Sfx.play('levelUp'), 160);
  }, reduced ? 0 : 400);
  setTimeout(done, reduced ? 200 : 1000);
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-close]') || e.target === modalRoot()) { stopVoice(); closeModal(); sync(); return; }
  let el;
  if (el = e.target.closest('[data-deny]')) {
    Sfx.play('denied');
    if (el.dataset.deny === 'locked') { toast(`Opens Day ${el.dataset.from}`); R2.bus.emit('bazaar:locked'); }
    else { toast(`Not enough ${cur} yet. Complete quests in the lobby.`); R2.bus.emit('bazaar:cantAfford'); }
    return;
  }
  if (el = e.target.closest('[data-open]')) { const it = itemById(el.dataset.open); if (it && owned(it.id)) openGift(it, false); return; }      // reopen: no effect, no new ledger entry
  if (el = e.target.closest('[data-copylink]')) { const u = el.dataset.copylink; try { navigator.clipboard.writeText(u).then(() => toast('Link copied', true), () => toast(u)); } catch (er) { toast(u); } return; }
  if (el = e.target.closest('[data-gp]')) { if (gp.list.length) { gp.i = (gp.i + +el.dataset.gp + gp.list.length) % gp.list.length; showPhoto(); } return; }
  if (el = e.target.closest('[data-buy]')) {
    const it = itemById(el.dataset.buy); if (!it) return;
    const price = R2.price(it);
    if (it.availableFromDay && R2.day() < it.availableFromDay) { toast(`Opens Day ${it.availableFromDay}`); return; }
    if (getCoins() < price) { toast(`Not enough ${cur} yet. Complete quests in the lobby.`); return; }
    openModal('Buy this?', `<div class="mrow"><div class="tx"><b>${esc(it.name)}</b><small>${esc(teaserOf(it))}</small></div></div>
      <p class="mnote">Price: ${coinText(price)} &nbsp; You have: ${coinText(getCoins())}</p>
      <div class="row-flex"><button type="button" class="mbtn grey" data-close>Cancel</button><button type="button" class="mbtn" data-confirm="${esc(it.id)}">Buy</button></div>`);
    return;
  }
  if (el = e.target.closest('[data-confirm]')) {
    const it = itemById(el.dataset.confirm); if (!it) return;
    const r = R2.buyItem(it);
    if (!r.ok) {
      closeModal();
      if (r.reason !== 'busy') toast(r.reason === 'owned' ? 'You already have this.' : r.reason === 'locked' ? `Opens Day ${it.availableFromDay}` : `Not enough ${cur} yet.`);
      render(); return;
    }
    closeModal(); freshId = it.id; render(); setTimeout(() => { freshId = ''; }, 6000); toast(`-${R2.price(it)} ${cur}`);
    unlockEffect(it, () => openGift(it, true));                       // the effect plays only on the first purchase
    return;
  }
});
$('#mine').addEventListener('click', () => {
  const rows = B.items.filter(it => owned(it.id)).map(it => `<div class="mrow"><div class="tx"><b>${esc(it.name)}</b><small>${esc(teaserOf(it))}</small></div><div class="act"><button type="button" class="mbtn small" data-open="${esc(it.id)}">Open</button></div></div>`).join('');
  openModal('My items', rows || '<p class="mnote">You have not bought anything yet.</p>');
});

/* ---------- back to the lobby ---------- */
$('#back').addEventListener('click', () => {
  try { window.close(); } catch (e) {}
  setTimeout(() => { location.href = R2.link(CONFIG.lobbyPage); }, 200);   // runs only if the tab could not close
});

/* ---------- music: only the Bazaar track plays here, the lobby track pauses ---------- */
const music = makeMusic(B.music, 'lastBazaarTrack', B.musicVolume, B.musicRotate);
let armed = false;
function sync() {
  if (document.hidden || isMuted()) { music.pause(); return; }
  music.play().then(ok => { if (!ok && !armed && music.track) arm(); });
}
function arm() {          // browsers need one tap before sound can start
  armed = true;
  const go = () => { armed = false; removeEventListener('pointerup', go, true); removeEventListener('keydown', go, true); removeEventListener('touchend', go, true); sync(); };
  addEventListener('pointerup', go, true); addEventListener('keydown', go, true); addEventListener('touchend', go, true);
}
function paintSound() {
  $('#snd .ico').innerHTML = isMuted() && !CONFIG.icons.sound ? DEFAULT_ICONS.mute : iconHTML('sound');
  $('#snd').style.opacity = isMuted() ? .7 : 1;
}
$('#snd').addEventListener('click', () => { store.set('muted', !isMuted()); paintSound(); sync(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && voice) voice.pause(); sync(); if (!document.hidden) render(); });
addEventListener('storage', render);
addEventListener('pagehide', () => say({ bazaar: false }));

/* ---------- start ---------- */
document.title = B.title;
$('#title').textContent = B.title;
{ const hn = $('#hint'), ht = (B.comingSoon ? B.comingSoonHint : B.hint) || ''; hn.textContent = ht; hn.hidden = !ht; }     // no text = no line, no gap
if (B.comingSoon) $('#mine').hidden = true;
document.body.classList.toggle('labels', !!CONFIG.showLabels);
applyBackground($('#bg'), innerWidth / innerHeight < 0.9 ? B.backgroundPhone : B.backgroundDesktop);
fillIcons(); paintSound(); render(); R2.on(render); showSaveNotice();
R2.loadDays().then(() => qAdd('bazaar'));     // counts for the "Open the Bazaar" quest (needs today's quest list)
$$('[data-r2]').forEach((el, i) => el.innerHTML = R2Char.markup('bz' + i + '_'));
const companion = R2Char.boot({ dev: R2.dev, buttons: $$('.r2btn'), phrases: R2.phrases(), name: () => CONFIG.herName, now: () => R2.now(), prefs: R2.pref, bus: R2.bus,
  daysLeft: () => Math.max(0, Math.ceil((+new Date(CONFIG.birthday) - R2.now()) / 864e5)) });
$('.companion .r2btn').addEventListener('click', () => companion.tap());
say({ bazaar: true });     // tells the lobby tab to pause its music
if (B.startScreen) {       // welcome window: her tap lets the music start
  const w = $('#welcome'), go = $('#welcomeGo');
  $('#welcomeTitle').textContent = B.welcomeTitle || 'Welcome';
  const wp = $('#welcomeText'); wp.textContent = B.welcomeText || ''; wp.hidden = !B.welcomeText;      // no text = no paragraph, no gap
  go.textContent = B.welcomeButton || 'ENTER';
  w.hidden = false; go.focus();
  go.addEventListener('click', () => { w.hidden = true; Sfx.unlock(); sync(); R2.bus.emit('bazaar:enter'); });
} else {
  sync(); setTimeout(() => R2.bus.emit('bazaar:enter'), 600);
}
</script>
</body>
